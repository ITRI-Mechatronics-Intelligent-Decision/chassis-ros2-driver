chassis_driver:
  ros__parameters:
    port: /dev/ttyUSB_chassis
    baudrate: 19200
    serial_timeout: 0.5
    send_interval: 0.1
    gear_ratio: 50.0
    # 10 吋充氣輪，直徑 265 mm
    wheel_radius: 0.1325
    # 輪距 = 2 × 0.20405 m
    wheel_separation: 0.4081
    cmd_left_direction: 1
    cmd_right_direction: 1
    fb_left_direction: 1
    fb_right_direction: 1
    publish_tf: true
    odom_frame: odom
    base_frame: base_footprint
    cmd_vel_timeout: 0.5

# Only started by localization_mode:=rep105_bridge.
map_odom_bridge:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    sensor_frame: box_link
