chassis_driver:
  ros__parameters:
    port: /dev/ttyUSB_chassis
    baudrate: 19200
    serial_timeout: 0.5
    send_interval: 0.1
    # 傳動與方向修正沿用 DD-M，尚未於 DD-M-HH 實機校正，出貨前須依 CLAUDE.md §5.1 驗證。
    gear_ratio: 50.0
    wheel_radius: 0.2032
    wheel_separation: 0.6221
    cmd_left_direction: 1
    cmd_right_direction: 1
    fb_left_direction: 1
    fb_right_direction: 1
    # false: publish /odom only and let an external localiser own odom -> base_frame.
    # bringup.launch.py overrides this from localization_mode.
    publish_tf: true
    odom_frame: odom
    base_frame: base_footprint
    cmd_vel_timeout: 0.5

# Only started by localization_mode:=rep105_bridge.
map_odom_bridge:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    # Sensor link the external localiser reports its pose for. The buyer mounts
    # this link under base_link in their own URDF and sets the name here.
    sensor_frame: box_link
